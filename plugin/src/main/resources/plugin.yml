name: "CooldownsX"
prefix: "CooldownsX"
description: "Configurable cooldowns for items, potions, and totems."
website: "https://www.spigotmc.org/resources/41981/"

main: "com.github.sirblobman.plugin.cooldown.CooldownPlugin"
version: "${version}"
api-version: "26.2"

folia-supported: true

authors:
  - "SirBlobman"

depend:
  - "BlueSlimeCore"

softdepend:
  - "PlaceholderAPI"

commands:
  cooldownsx:
    description: "Reload the configuration files."
    usage: "/<command>"
    aliases:
      - "cdx"
      - "cooldownx"
      - "cooldowns"
      - "cooldown"

permissions:
  cooldownsx.command.cooldownsx:
    description: "Gives access to the '/cooldownsx' command."
    default: op
